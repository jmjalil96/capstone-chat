[SERVICE]
    Flush                     1
    Grace                     5
    Log_Level                 warn
    Daemon                    Off
    HTTP_Server               Off
    Parsers_File              /etc/capstone-chat/fluent-bit-parsers.conf

[INPUT]
    Name                      forward
    Unix_Path                 /run/capstone-fluent-bit/docker.sock
    Unix_Perm                 0660
    Buffer_Chunk_Size         16K
    Buffer_Max_Size           16K
    Mem_Buf_Limit             8M
    storage.type              memory

[FILTER]
    Name                      parser
    Match                     capstone.api*
    Key_Name                  log
    Parser                    capstone_json
    Reserve_Data              Off
    Preserve_Key              Off

[FILTER]
    Name                      modify
    Match                     capstone.api*
    Hard_Rename               msg message
    Remove                    log

[FILTER]
    Name                      record_modifier
    Match                     capstone.api*
    Allowlist_key             level
    Allowlist_key             time
    Allowlist_key             pid
    Allowlist_key             hostname
    Allowlist_key             requestId
    Allowlist_key             message
    Allowlist_key             operation
    Allowlist_key             signal
    Allowlist_key             errorName
    Allowlist_key             configurationKey
    Allowlist_key             errorCode
    Allowlist_key             databaseSeverity
    Allowlist_key             databaseSchema
    Allowlist_key             databaseTable
    Allowlist_key             databaseColumn
    Allowlist_key             databaseConstraint
    Allowlist_key             databaseRoutine
    Allowlist_key             category
    Allowlist_key             durationMs
    Allowlist_key             providerStatus
    Allowlist_key             purpose
    Allowlist_key             hook
    Allowlist_key             method
    Allowlist_key             responseTime
    Allowlist_key             route
    Allowlist_key             statusCode
    Allowlist_key             asset
    Allowlist_key             column
    Allowlist_key             kind
    Allowlist_key             line
    Allowlist_key             release
    Allowlist_key             clientAddressSource
    Allowlist_key             emailDelivery
    Allowlist_key             deploymentRevision
    Allowlist_key             host
    Allowlist_key             logLevel
    Allowlist_key             modelGateway
    Allowlist_key             nodeEnv
    Allowlist_key             port
    Allowlist_key             publicOrigin
    Allowlist_key             trustProxy
    Allowlist_key             telemetry
    Allowlist_key             webAssets
    Allowlist_key             readiness
    Allowlist_key             database

[OUTPUT]
    Name                      http
    Match                     capstone.api*
    Host                      log-api.newrelic.com
    Port                      443
    URI                       /log/v1
    Format                    json
    Header                    Api-Key ${NEW_RELIC_LICENSE_KEY}
    Header                    Content-Type application/json
    json_date_key             timestamp
    json_date_format          iso8601
    log_response_payload      Off
    tls                       On
    tls.verify                On
    net.keepalive             On
    Workers                   1
    Retry_Limit               10
