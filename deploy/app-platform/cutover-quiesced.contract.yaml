schema: 1
mode: cutover-quiesced
name: capstone-chat-production
region: ric
features:
  - buildpack-stack=ubuntu-22
source:
  github:
    repo: jmjalil96/capstone-chat
    branch: app-platform-production
    deploy_on_push: false
  source_dir: /
  dockerfile_path: apps/api/Dockerfile
egress:
  type: DEDICATED_IP
edge:
  disable_edge_cache: true
  disable_email_obfuscation: true
  enhanced_threat_control_enabled: false
domain:
  domain: chat.capstone.com.ec
  type: PRIMARY
  minimum_tls_version: "1.2"
service:
  name: capstone-chat
  instance_size_slug: apps-s-1vcpu-1gb-fixed
  instance_count: 1
  http_port: 3000
  run_command: node apps/api/dist/entrypoint.js egress-bootstrap
  readiness_path: /api/health/ready
  liveness_path: /api/health/live
  drain_seconds: 110
  grace_period_seconds: 300
  environment:
    general:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DEPLOYMENT_TARGET: digitalocean-app-platform
      DEPLOYMENT_REVISION: ${_self.COMMIT_HASH}
      CAPSTONE_SECRET_SOURCE: platform-environment
      CLIENT_ADDRESS_SOURCE: digitalocean-app-platform
    secret_keys: []
alerts:
  app:
    - DEPLOYMENT_FAILED
    - DEPLOYMENT_LIVE
    - DOMAIN_FAILED
  service:
    cpu_percent: 85
    memory_percent: 85
    restart_count: 1
    request_duration_p95_ms: 750
