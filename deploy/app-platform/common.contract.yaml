schema: 1
region: ric
features:
  - buildpack-stack=ubuntu-22
source:
  github:
    repo: jmjalil96/capstone-chat
    deploy_on_push: false
  source_dir: /
  dockerfile_path: apps/api/Dockerfile
service:
  name: capstone-chat
  instance_count: 1
  http_port: 3000
  run_command: node apps/api/dist/entrypoint.js server
  readiness_path: /api/health/ready
  liveness_path: /api/health/live
  drain_seconds: 110
  grace_period_seconds: 300
  environment:
    general:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      EMAIL_DELIVERY: resend
      LOG_LEVEL: info
      MODEL_GATEWAY: openrouter
      WEB_ASSETS: production-build
      DEPLOYMENT_TARGET: digitalocean-app-platform
      DEPLOYMENT_REVISION: ${_self.COMMIT_HASH}
      CAPSTONE_SECRET_SOURCE: platform-environment
      CLIENT_ADDRESS_SOURCE: digitalocean-app-platform
    general_keys:
      - OTEL_EXPORTER_OTLP_ENDPOINT
    secret_keys:
      - BETTER_AUTH_SECRET
      - DATABASE_URL
      - OPENROUTER_API_KEY
      - OTEL_EXPORTER_OTLP_HEADERS
      - RESEND_API_KEY
job:
  name: capstone-migrate
  kind: PRE_DEPLOY
  instance_count: 1
  run_command: node apps/api/dist/entrypoint.js migrate
  grace_period_seconds: 300
  environment:
    general:
      NODE_ENV: production
      DEPLOYMENT_TARGET: digitalocean-app-platform
      DEPLOYMENT_REVISION: ${_self.COMMIT_HASH}
      CAPSTONE_SECRET_SOURCE: platform-environment
    secret_keys:
      - DATABASE_URL
edge:
  disable_edge_cache: true
  disable_email_obfuscation: true
  enhanced_threat_control_enabled: false
alerts:
  app:
    - DEPLOYMENT_FAILED
    - DEPLOYMENT_LIVE
    - DOMAIN_FAILED
  service:
    cpu_percent: 85
    memory_percent: 85
    restart_count: 1
    request_duration_p95_ms: 750
