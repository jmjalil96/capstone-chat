schema: 1
mode: rehearsal
name: capstone-chat-rehearsal
region: ric
image:
  registry_type: GHCR
  registry: jmjalil96
  repository: capstone-chat
egress:
  type: DEDICATED_IP
edge:
  disable_edge_cache: true
  disable_email_obfuscation: true
  enhanced_threat_control_enabled: false
domain:
  domain: rehearsal.chat.capstone.com.ec
  type: PRIMARY
  minimum_tls_version: "1.2"
service:
  name: capstone-chat
  instance_size_slug: apps-s-1vcpu-1gb-fixed
  instance_count: 1
  http_port: 3000
  run_command: node --expose-gc apps/api/dist/entrypoint.js load-server --confirm-isolated-load-rehearsal
  readiness_path: /api/health/ready
  liveness_path: /api/health/live
  drain_seconds: 110
  grace_period_seconds: 300
  environment:
    general:
      CAPSTONE_DEPLOYMENT_PROFILE: managed-rehearsal
      CAPSTONE_SECRET_SOURCE: platform-environment
      CLIENT_ADDRESS_SOURCE: digitalocean-app-platform
      DEPLOYMENT_TARGET: digitalocean-app-platform
      EMAIL_DELIVERY: disabled
      HOST: 0.0.0.0
      LOG_LEVEL: info
      MODEL_GATEWAY: openrouter
      NODE_ENV: test
      PORT: "3000"
      PUBLIC_ORIGIN: https://rehearsal.chat.capstone.com.ec
      WEB_ASSETS: production-build
    general_keys:
      - OTEL_EXPORTER_OTLP_ENDPOINT
    secret_keys:
      - BETTER_AUTH_SECRET
      - CAPSTONE_LOAD_DIAGNOSTICS_SECRET
      - DATABASE_URL
      - OTEL_EXPORTER_OTLP_HEADERS
job:
  name: capstone-migrate
  kind: PRE_DEPLOY
  instance_size_slug: apps-s-1vcpu-0.5gb
  instance_count: 1
  run_command: node apps/api/dist/entrypoint.js migrate
  grace_period_seconds: 300
  environment:
    general:
      CAPSTONE_DEPLOYMENT_PROFILE: managed-rehearsal
      CAPSTONE_SECRET_SOURCE: platform-environment
      DEPLOYMENT_TARGET: digitalocean-app-platform
      NODE_ENV: test
    secret_keys:
      - DATABASE_URL
alerts:
  app:
    - DEPLOYMENT_FAILED
    - DEPLOYMENT_LIVE
    - DOMAIN_FAILED
  service:
    cpu_percent: 85
    memory_percent: 85
    restart_count: 1
    request_duration_p95_ms: 750
