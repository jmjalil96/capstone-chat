name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_revision:
        description: Exact green main commit already accepted by staging
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: capstone-chat-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Promote accepted staging revision
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: production
      url: https://chat.capstone.com.ec
    env:
      CAPSTONE_RELEASE_REVISION: ${{ inputs.release_revision }}
    steps:
      - name: Check out main history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: main

      - name: Validate fixed target, ancestry, and successful staging CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${#CAPSTONE_RELEASE_REVISION}" -eq 40
          case "$CAPSTONE_RELEASE_REVISION" in *[!0-9a-f]*) exit 1 ;; esac
          test "$(git cat-file -t "$CAPSTONE_RELEASE_REVISION")" = commit

          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/app-platform-production:refs/remotes/origin/app-platform-production
          git merge-base --is-ancestor "$CAPSTONE_RELEASE_REVISION" refs/remotes/origin/main
          production_revision="$(git rev-parse refs/remotes/origin/app-platform-production)"
          test "$production_revision" != "$CAPSTONE_RELEASE_REVISION"
          git merge-base --is-ancestor "$production_revision" "$CAPSTONE_RELEASE_REVISION"

          ci_result="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$CAPSTONE_RELEASE_REVISION" \
            -f branch=main \
            -f event=push \
            -f status=completed \
            -f per_page=20 \
            --jq '.workflow_runs | max_by(.run_number) | [.head_sha,.head_branch,.event,.conclusion] | @tsv')"
          test "$ci_result" = "$CAPSTONE_RELEASE_REVISION"$'\tmain\tpush\tsuccess'

      - name: Deploy production source
        uses: ./.github/actions/deploy-app-platform
        with:
          access-token: ${{ secrets.DIGITALOCEAN_DEPLOY_TOKEN }}
          app-id: ${{ vars.DIGITALOCEAN_APP_ID }}
          environment: production
          revision: ${{ inputs.release_revision }}
