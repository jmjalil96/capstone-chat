name: GHCR retention

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a dry-run plan or execute one separately reviewed plan
        required: true
        type: choice
        options:
          - plan
          - delete
      plan_run_id:
        description: Dry-run workflow run ID; required only for delete
        required: false
        type: string
      plan_sha256:
        description: Reviewed dry-run plan SHA-256; required only for delete
        required: false
        type: string
      recovery_pins_json:
        description: Bounded schema-1 recovery pin document from the sealed recovery authority
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: capstone-chat-production-app-spec
  cancel-in-progress: false

jobs:
  retention:
    name: Reviewed GHCR retention
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CAPSTONE_OPERATION: ${{ inputs.operation }}
      CAPSTONE_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      CAPSTONE_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      CAPSTONE_RECOVERY_PINS_JSON: ${{ inputs.recovery_pins_json }}
      CAPSTONE_TOOL_REVISION: ${{ github.sha }}
      DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate protected tooling authority
        run: test "$(git rev-parse HEAD)" = "$CAPSTONE_TOOL_REVISION"

      - name: Prepare protected inputs
        id: inputs
        run: |
          umask 077
          directory="$(mktemp -d)"
          trap 'rm -rf -- "$directory"' EXIT HUP INT TERM
          printf '%s' "$DIGITALOCEAN_TOKEN" > "$directory/digitalocean-token"
          printf '%s' "$GITHUB_API_TOKEN" > "$directory/github-token"
          printf '%s' "$GHCR_RETENTION_TOKEN" > "$directory/package-token"
          printf '%s\n' "$CAPSTONE_RECOVERY_PINS_JSON" > "$directory/recovery-pins.json"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert value.get("schema") == 1 and isinstance(value.get("pins"), list)' "$directory/recovery-pins.json"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
          trap - EXIT HUP INT TERM
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_DEPLOY_TOKEN }}
          GHCR_RETENTION_TOKEN: ${{ secrets.GHCR_RETENTION_TOKEN }}
          GITHUB_API_TOKEN: ${{ github.token }}

      - name: Download the separately reviewed dry-run plan
        if: ${{ inputs.operation == 'delete' }}
        run: |
          case "$CAPSTONE_PLAN_RUN_ID" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          test "${#CAPSTONE_PLAN_SHA256}" -eq 64
          case "$CAPSTONE_PLAN_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          gh run download "$CAPSTONE_PLAN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ghcr-retention-plan \
            --dir "$CAPSTONE_PROTECTED_DIRECTORY"
          chmod 0600 "$CAPSTONE_PROTECTED_DIRECTORY/ghcr-retention-plan.json"
        env:
          CAPSTONE_PROTECTED_DIRECTORY: ${{ steps.inputs.outputs.directory }}
          GH_TOKEN: ${{ github.token }}

      - name: Build or execute the reviewed plan
        id: retention
        run: |
          arguments=(
            "$CAPSTONE_OPERATION"
            --app-id "$DIGITALOCEAN_APP_ID"
            --digitalocean-token-file "$CAPSTONE_PROTECTED_DIRECTORY/digitalocean-token"
            --github-token-file "$CAPSTONE_PROTECTED_DIRECTORY/github-token"
            --image-repository "$IMAGE_REPOSITORY"
            --owner "${GITHUB_REPOSITORY_OWNER}"
            --package capstone-chat
            --package-token-file "$CAPSTONE_PROTECTED_DIRECTORY/package-token"
            --plan-file "$CAPSTONE_PROTECTED_DIRECTORY/ghcr-retention-plan.json"
            --recovery-pins-file "$CAPSTONE_PROTECTED_DIRECTORY/recovery-pins.json"
            --scope users
            --tool-revision "$CAPSTONE_TOOL_REVISION"
          )
          if test "$CAPSTONE_OPERATION" = delete; then
            arguments+=(--plan-hash "$CAPSTONE_PLAN_SHA256")
          else
            test -z "$CAPSTONE_PLAN_RUN_ID"
            test -z "$CAPSTONE_PLAN_SHA256"
          fi
          result="$(python3 deploy/app-platform/ghcr-retention.py "${arguments[@]}")"
          printf '%s\n' "$result"
          rm -f -- \
            "$CAPSTONE_PROTECTED_DIRECTORY/digitalocean-token" \
            "$CAPSTONE_PROTECTED_DIRECTORY/github-token" \
            "$CAPSTONE_PROTECTED_DIRECTORY/package-token" \
            "$CAPSTONE_PROTECTED_DIRECTORY/recovery-pins.json"
          if test "$CAPSTONE_OPERATION" = plan; then
            hash="$(printf '%s' "$result" | jq -er '.planSha256')"
            printf 'plan_sha256=%s\n' "$hash" >> "$GITHUB_OUTPUT"
            printf 'Reviewed plan SHA-256: `%s`\n' "$hash" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CAPSTONE_PROTECTED_DIRECTORY: ${{ steps.inputs.outputs.directory }}

      - name: Retain the dry-run plan for separate review
        if: ${{ inputs.operation == 'plan' }}
        uses: actions/upload-artifact@v5
        with:
          name: ghcr-retention-plan
          path: ${{ steps.inputs.outputs.directory }}/ghcr-retention-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove protected inputs
        if: ${{ always() }}
        run: |
          case "$CAPSTONE_PROTECTED_DIRECTORY" in
            /tmp/tmp.*) rm -rf -- "$CAPSTONE_PROTECTED_DIRECTORY" ;;
            *) exit 1 ;;
          esac
        env:
          CAPSTONE_PROTECTED_DIRECTORY: ${{ steps.inputs.outputs.directory }}
