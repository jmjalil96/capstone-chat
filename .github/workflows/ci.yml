name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality, integration, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETTER_AUTH_SECRET: capstone-chat-ci-auth-secret-not-for-production-use
      DATABASE_URL: postgresql://capstone:capstone-test-password@127.0.0.1:5432/capstone_chat_ci
      EMAIL_DELIVERY: fake
      LOG_LEVEL: silent
      PUBLIC_ORIGIN: http://127.0.0.1:4173
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: capstone_chat_ci
          POSTGRES_PASSWORD: capstone-test-password
          POSTGRES_USER: capstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capstone -d capstone_chat_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Check repository boundaries and credential literals
        run: pnpm verify:repository

      - name: Validate deployment and recovery artifacts
        run: pnpm verify:operations

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Apply migrations to a clean database
        run: pnpm db:migrate
        env:
          NODE_ENV: test

      - name: Run unit and PostgreSQL integration tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Build production applications
        run: pnpm build
        env:
          DEPLOYMENT_REVISION: ${{ github.sha }}

      - name: Report and verify the production web bundle
        run: pnpm report:bundle

      - name: Build production API image
        run: docker build --build-arg DEPLOYMENT_REVISION="$GITHUB_SHA" --file apps/api/Dockerfile --tag capstone-chat-api:ci .

      - name: Verify API image runtime contents and user
        run: |
          test "$(docker image inspect capstone-chat-api:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect capstone-chat-api:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --env EXPECTED_REVISION="$GITHUB_SHA" --entrypoint sh capstone-chat-api:ci -ec '
            test "$(id -u)" -ne 0
            test -f /app/apps/api/dist/entrypoint.js
            test -f /app/apps/api/dist/server.js
            test -d /app/apps/api/migrations
            test -f /app/apps/api/migrations/0007_sloppy_northstar.sql
            test -f /app/apps/web/dist/index.html
            test -n "$(find /app/apps/web/dist/assets -maxdepth 1 -type f -print -quit)"
            test -z "$(find /app/apps/api/dist /app/apps/web/dist /app/packages/protocol/dist -type f -name \*.map -print -quit)"
            test ! -d /app/apps/api/tests
            test ! -d /app/apps/web/e2e
            test -z "$(find /app/apps/api /app/apps/web -maxdepth 2 -type f -name .env\* -print -quit)"
            test "$DEPLOYMENT_REVISION" = "$EXPECTED_REVISION"
            test -z "${CAPSTONE_SECRET_SOURCE+x}"
            test -z "${CLIENT_ADDRESS_SOURCE+x}"
            test -z "${DEPLOYMENT_TARGET+x}"
            test -z "${HOST+x}"
            test -z "${NODE_ENV+x}"
            test -z "${PORT+x}"
            grep -R -F -l "$EXPECTED_REVISION" /app/apps/web/dist/assets >/dev/null
          '

      - name: Start and smoke the production image
        run: pnpm smoke:container -- capstone-chat-api:ci "$GITHUB_SHA"

  playwright:
    name: Playwright identity, conversation, and streaming suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: capstone-chat-ci-auth-secret-not-for-production-use
      EMAIL_DELIVERY: fake
      LOG_LEVEL: silent
      PUBLIC_ORIGIN: http://127.0.0.1:4173
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported browsers
        run: pnpm --filter @capstone/web exec playwright install --with-deps chromium firefox webkit chrome msedge

      - name: Run identity, conversation, streaming, mobile, and accessibility browser tests
        run: pnpm test:e2e

      - name: Retain Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish-image:
    name: Publish immutable production image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [quality, playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: capstone-chat-image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DATABASE_URL: postgresql://capstone:capstone-publish-password@127.0.0.1:5432/capstone_chat_publish
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: capstone_chat_publish
          POSTGRES_PASSWORD: capstone-publish-password
          POSTGRES_USER: capstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capstone -d capstone_chat_publish"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0

      - name: Build the exact immutable image
        run: |
          image="$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker build \
            --build-arg DEPLOYMENT_REVISION="$GITHUB_SHA" \
            --file apps/api/Dockerfile \
            --tag "$image" \
            .
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/$GITHUB_REPOSITORY"

      - name: Verify runtime contents and smoke the exact image
        run: |
          image="$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker run --rm --env EXPECTED_REVISION="$GITHUB_SHA" --entrypoint sh "$image" -ec '
            test "$(id -u)" -ne 0
            test -f /app/apps/api/dist/entrypoint.js
            test -f /app/apps/api/dist/server.js
            test -f /app/apps/api/migrations/0007_sloppy_northstar.sql
            test -f /app/apps/web/dist/index.html
            test -z "$(find /app/apps/api/dist /app/apps/web/dist /app/packages/protocol/dist -type f -name \*.map -print -quit)"
            test ! -d /app/apps/api/tests
            test ! -d /app/apps/web/e2e
            test -z "$(find /app/apps/api /app/apps/web -maxdepth 2 -type f -name .env\* -print -quit)"
            test "$DEPLOYMENT_REVISION" = "$EXPECTED_REVISION"
            test -z "${CAPSTONE_SECRET_SOURCE+x}"
            test -z "${CLIENT_ADDRESS_SOURCE+x}"
            test -z "${DEPLOYMENT_TARGET+x}"
            test -z "${HOST+x}"
            test -z "${NODE_ENV+x}"
            test -z "${PORT+x}"
            grep -R -F -l "$EXPECTED_REVISION" /app/apps/web/dist/assets >/dev/null
          '
          pnpm smoke:container -- "$image" "$GITHUB_SHA"

      - name: Authenticate to GitHub Container Registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the full-revision tag without remapping it
        run: |
          image="$IMAGE_REPOSITORY:$GITHUB_SHA"
          candidate_id="$(docker image inspect "$image" --format '{{.Id}}')"
          error_file="$(mktemp)"
          trap 'rm -f -- "$error_file"' EXIT

          if existing_manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' 2>"$error_file")"; then
            existing_digest="$(printf '%s' "$existing_manifest" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
            docker pull "$IMAGE_REPOSITORY@$existing_digest"
            existing_id="$(docker image inspect "$IMAGE_REPOSITORY@$existing_digest" --format '{{.Id}}')"
            test "$existing_id" = "$candidate_id" || {
              echo 'The immutable revision tag already maps to different image content.' >&2
              exit 1
            }
            digest="$existing_digest"
            outcome=reused
          else
            grep -Eqi 'manifest unknown|not found' "$error_file" || {
              echo 'Unable to establish whether the immutable revision tag exists.' >&2
              exit 1
            }
            push_output="$(docker push "$image")"
            digest="$(printf '%s\n' "$push_output" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' | tail -n 1)"
            test -n "$digest"
            outcome=published
          fi

          confirmed_manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')"
          confirmed_digest="$(printf '%s' "$confirmed_manifest" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          test "$confirmed_digest" = "$digest"
          docker pull "$IMAGE_REPOSITORY@$confirmed_digest"
          test "$(docker image inspect "$IMAGE_REPOSITORY@$confirmed_digest" --format '{{.Id}}')" = "$candidate_id"
          printf '%s `%s@%s`\n' "$outcome" "$IMAGE_REPOSITORY" "$digest" >> "$GITHUB_STEP_SUMMARY"
