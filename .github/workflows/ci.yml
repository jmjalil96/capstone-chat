name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality, integration, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETTER_AUTH_SECRET: capstone-chat-ci-auth-secret-not-for-production-use
      DATABASE_URL: postgresql://capstone:capstone-test-password@127.0.0.1:5432/capstone_chat_ci
      EMAIL_DELIVERY: fake
      LOG_LEVEL: silent
      PUBLIC_ORIGIN: http://127.0.0.1:4173
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: capstone_chat_ci
          POSTGRES_PASSWORD: capstone-test-password
          POSTGRES_USER: capstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capstone -d capstone_chat_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Check repository boundaries and credential literals
        run: pnpm verify:repository

      - name: Validate deployment and recovery artifacts
        run: pnpm verify:operations

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Apply migrations to a clean database
        run: pnpm db:migrate
        env:
          NODE_ENV: test

      - name: Run unit and PostgreSQL integration tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Build production applications
        run: pnpm build
        env:
          RENDER_GIT_COMMIT: ${{ github.sha }}

      - name: Report and verify the production web bundle
        run: pnpm report:bundle

      - name: Build production API image
        run: docker build --build-arg RENDER_GIT_COMMIT="$GITHUB_SHA" --file apps/api/Dockerfile --tag capstone-chat-api:ci .

      - name: Verify API image runtime contents and user
        run: |
          test "$(docker image inspect capstone-chat-api:ci --format '{{.Config.User}}')" = "node"
          docker run --rm --env EXPECTED_REVISION="$GITHUB_SHA" --entrypoint sh capstone-chat-api:ci -ec '
            test "$(id -u)" -ne 0
            test -f /app/apps/api/dist/server.js
            test -d /app/apps/api/migrations
            test -n "$(find /app/apps/api/migrations -maxdepth 1 -name \*.sql -print -quit)"
            test -f /app/apps/web/dist/index.html
            test -n "$(find /app/apps/web/dist/assets -maxdepth 1 -type f -print -quit)"
            test -z "$(find /app/apps/api/dist /app/apps/web/dist /app/packages/protocol/dist -type f -name \*.map -print -quit)"
            test ! -d /app/apps/api/tests
            test ! -d /app/apps/web/e2e
            test -z "$(find /app/apps/api /app/apps/web -maxdepth 2 -type f -name .env\* -print -quit)"
            grep -R -F -l "$EXPECTED_REVISION" /app/apps/web/dist/assets >/dev/null
          '

      - name: Start and smoke the production image
        run: pnpm smoke:container -- capstone-chat-api:ci "$GITHUB_SHA"

  playwright:
    name: Playwright identity, conversation, and streaming suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: capstone-chat-ci-auth-secret-not-for-production-use
      EMAIL_DELIVERY: fake
      LOG_LEVEL: silent
      PUBLIC_ORIGIN: http://127.0.0.1:4173
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported browsers
        run: pnpm --filter @capstone/web exec playwright install --with-deps chromium firefox webkit chrome msedge

      - name: Run identity, conversation, streaming, mobile, and accessibility browser tests
        run: pnpm test:e2e

      - name: Retain Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
